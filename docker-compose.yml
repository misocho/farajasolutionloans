services:
  postgres:
    image: postgres:16
    container_name: faraja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faraja
    ports:
      # 5434 avoids clashes with the enkaai infra/agents Postgres stacks (5432, 5433).
      - "5434:5432"
    volumes:
      - faraja_pgdata:/var/lib/postgresql/data

volumes:
  faraja_pgdata: